name: Protocol autofix

on:
  push:
    branches:
      - feat/4-update-extension-protocol

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build public self-imports
        run: bun run build

      - name: Canonically format and autofix
        run: |
          bun run format
          bun run lint:fix
          bun run format

      - name: Persist autofix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git reset -- .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply canonical protocol formatting"
          git push origin HEAD:feat/4-update-extension-protocol
