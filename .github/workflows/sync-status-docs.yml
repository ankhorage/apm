name: Sync status docs

on:
  push:
    branches:
      - feat/3-evidence-status

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate and format documentation
        run: |
          bun run docs
          bun run format

      - name: Persist generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md paradox
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: sync status documentation"
          git push origin HEAD:feat/3-evidence-status
