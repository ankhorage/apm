name: Recovery owner workspace

on:
  push:
    branches: [fix/17-revalidate-recovery-journal]
    paths: [.github/workflows/recovery-owner-workspace.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare frozen recovery workspace
        run: |
          bun install --frozen-lockfile --ignore-scripts
          mkdir -p "$RUNNER_TEMP/recovery-owner"
          git bundle create "$RUNNER_TEMP/recovery-owner/repository.bundle" HEAD refs/remotes/origin/main
          tar -czf "$RUNNER_TEMP/recovery-owner/dependencies.tgz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-owner-workspace
          path: ${{ runner.temp }}/recovery-owner/
          retention-days: 1
          compression-level: 0
