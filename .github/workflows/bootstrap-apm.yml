name: Bootstrap APM

on:
  push:
    branches:
      - feat/2-initialize-apm

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install bootstrap dependencies
        run: bun install

      - name: Synchronize canonical Devtools baseline
        run: bunx @ankhorage/ankh devtools sync .

      - name: Install synchronized dependencies
        run: bun install

      - name: Generate documentation
        run: bun run docs

      - name: Remove one-time bootstrap workflow
        run: rm .github/workflows/bootstrap-apm.yml

      - name: Canonically format and fix imports
        run: |
          bun run format
          bun run lint:fix
          bun run format

      - name: Validate package
        run: |
          bun run build
          bun run check-types
          bun run lint
          bun run knip:check
          bun run test
          bun run format:check

      - name: Pack and verify public entrypoints
        run: |
          rm -rf /tmp/apm-pack /tmp/apm-consumer
          mkdir -p /tmp/apm-pack /tmp/apm-consumer
          npm pack --pack-destination /tmp/apm-pack
          tarball="$(find /tmp/apm-pack -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          cd /tmp/apm-consumer
          npm init -y >/dev/null
          npm install "$tarball" @ankhorage/ankh@0.8.13 >/dev/null
          node --input-type=module -e "await Promise.all([import('@ankhorage/apm'), import('@ankhorage/apm/node'), import('@ankhorage/apm/types'), import('@ankhorage/apm/cli')])"
          ./node_modules/.bin/apm status . --json
          ./node_modules/.bin/ankh apm status . --json

      - name: Commit synchronized baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync canonical repository baseline"
          git push origin HEAD:${{ github.ref_name }}
