name: APM status workspace

on:
  push:
    branches: [fix/18-complete-bun-status]
    paths: [.github/workflows/status-validation-workspace.yml]

permissions:
  contents: write

concurrency:
  group: apm-status-implementation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OWNER_VERSION: '2.6.1'
      STUDIO_ARTIFACT_INTEGRITY: sha512-fiTXRJgavMSN9pDHJODRLFySOjjm+kVpn2xSsyjd5jj3ZmJWUI2LWL43cZLZYlzPDN4Qj/uSSPBky88kjRS2gA==
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/18-complete-bun-status
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ankhorage/studio
          ref: 315e000519bd5200693996217a4d4dbcaac36f58
          path: .owner-proof-input
          sparse-checkout: scripts/apm-published-core-proof.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed APM status changes
        run: |
          test "$(git rev-parse HEAD^)" = 1f8771e62abb676e433dbf094ab773e1536797f8
          cp .owner-proof-input/scripts/apm-published-core-proof.ts "$RUNNER_TEMP/verify-core.ts"
          rm -rf .owner-proof-input
          cat .github/apm-status-part1.bz2 .github/apm-status-part2.bz2 | bzip2 -dc > "$RUNNER_TEMP/status.patch"
          echo "28cc922da2897152cfda07b0ee1b7e9b9953f86f9bf63df77479bde0032b2483  $RUNNER_TEMP/status.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/status.patch"
          git apply --index "$RUNNER_TEMP/status.patch"
          git rm .github/apm-status-part1.bz2 .github/apm-status-part2.bz2
          rm .github/workflows/status-validation-workspace.yml
      - name: Validate source and regenerate owned documentation
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          bun run check-types
          bun run lint
          bun run knip:check
          bun run changeset:status
          bun run docs
          bun run format
          bun run test
          bun run format:check
          git diff --check
      - name: Prepare actual Studio graph and packed APM candidate
        run: |
          mkdir -p "$RUNNER_TEMP/core-proof/consumer" "$RUNNER_TEMP/core-proof/evidence" "$RUNNER_TEMP/core-proof/archive"
          bun pm pack --filename "$RUNNER_TEMP/core-proof/archive/apm-candidate.tgz" --ignore-scripts --quiet
          npm view "@ankhorage/studio@${OWNER_VERSION}" dist --json > "$RUNNER_TEMP/core-proof/evidence/dist.json"
          npm pack "@ankhorage/studio@${OWNER_VERSION}" --ignore-scripts --json --pack-destination "$RUNNER_TEMP/core-proof/archive" > "$RUNNER_TEMP/core-proof/evidence/pack.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFile,writeFile} from 'node:fs/promises';
          const root=process.env.RUNNER_TEMP+'/core-proof';
          const dist=JSON.parse(await readFile(root+'/evidence/dist.json','utf8'));
          const [packed]=JSON.parse(await readFile(root+'/evidence/pack.json','utf8'));
          assert.equal(packed.filename,'ankhorage-studio-2.6.1.tgz');
          const actual='sha512-'+createHash('sha512').update(await readFile(root+'/archive/'+packed.filename)).digest('base64');
          assert.equal(actual,dist.integrity);
          assert.equal(actual,process.env.STUDIO_ARTIFACT_INTEGRITY);
          await writeFile(root+'/consumer/package.json',JSON.stringify({name:'published-owner-candidate-core-plan-fixture',private:true,type:'module',dependencies:{'@ankhorage/studio':'2.6.1','@ankhorage/apm':'file:'+root+'/archive/apm-candidate.tgz'}}));
          const source=await readFile(process.env.RUNNER_TEMP+'/verify-core.ts','utf8');
          const oldStatus='status: { inspectStatusAsync: (request) => statusProjectAsync(request, { extensions }) }';
          assert.ok(source.includes(oldStatus));
          const instrumented=source.replace(oldStatus,`status: { inspectStatusAsync: async (request) => {
            const status = await statusProjectAsync(request, { extensions });
            await writeFile(resolve(process.env.EVIDENCE_ROOT, 'status.json'), JSON.stringify(status, null, 2));
            return status;
          } }`).replace('  assert.equal(\n    result.complete,', `  await writeFile(resolve(process.env.EVIDENCE_ROOT, 'apm-plan.json'), JSON.stringify(result, null, 2));
            assert.equal(\n    result.complete,`).replace('JSON.stringify({ blockers: result.blockers, diagnostics: result.diagnostics })','JSON.stringify({ blockers: result.blockers.map(({code})=>code), diagnostics: [...new Set(result.diagnostics.map(({code})=>code))] })');
          await writeFile(root+'/consumer/verify-core.ts',instrumented);
          JS
      - name: Install the real native Bun graph
        run: |
          cd "$RUNNER_TEMP/core-proof/consumer"
          export BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/core-proof/cache"
          bun install --ignore-scripts
          node verify-core.ts prime
          bun install --ignore-scripts
          bun install --frozen-lockfile --ignore-scripts
      - name: Reproduce owner projection planning through the actual APM core
        run: |
          cd "$RUNNER_TEMP/core-proof/consumer"
          export EVIDENCE_ROOT="$RUNNER_TEMP/core-proof/evidence"
          node verify-core.ts plan > "$EVIDENCE_ROOT/proof.json"
          cat "$EVIDENCE_ROOT/proof.json"
      - name: Capture concrete graph evidence even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/core-proof/evidence"
          for file in package.json bun.lock; do
            if test -f "$RUNNER_TEMP/core-proof/consumer/$file"; then
              cp "$RUNNER_TEMP/core-proof/consumer/$file" "$RUNNER_TEMP/core-proof/evidence/"
            fi
          done
          node --version > "$RUNNER_TEMP/core-proof/evidence/node-version.txt"
          bun --version > "$RUNNER_TEMP/core-proof/evidence/bun-version.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apm-candidate-core-plan-proof
          path: ${{ runner.temp }}/core-proof/evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Commit validated source on the existing task branch
        run: |
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git add --all
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: inspect complete Bun graphs with bounded registry concurrency' -m 'Refs #18' -m 'Roadmap: #1; published lifecycle acceptance: #7'
          git push origin HEAD:refs/heads/fix/18-complete-bun-status
          echo "Validated candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
