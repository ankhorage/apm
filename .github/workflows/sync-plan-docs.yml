name: Sync plan docs

on:
  push:
    branches:
      - feat/5-reproducible-update-plans

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Generate documentation
        run: bun run docs

      - name: Apply canonical lint fixes
        run: bun run lint:fix

      - name: Apply canonical formatting
        run: bun run format

      - name: Commit synchronized artifacts
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: sync reproducible planning artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
