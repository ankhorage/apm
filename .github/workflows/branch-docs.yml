name: Branch docs generation

on:
  push:
    branches:
      - feat/15-cooperative-project-writer-locking

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/15-cooperative-project-writer-locking

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Paradox documentation
        run: bun run docs

      - name: Commit generated documentation
        run: |
          git add README.md paradox
          if git diff --cached --quiet; then
            echo "Documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate Paradox artifacts"
          git push origin HEAD:feat/15-cooperative-project-writer-locking
